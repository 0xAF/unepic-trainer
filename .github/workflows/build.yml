name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build pinned container
        run: docker build -t unepic-trainer-builder -f packaging/Dockerfile packaging
      - name: Test, package and smoke-test
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          docker run --rm --init --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e QT_QPA_PLATFORM=offscreen -e PYTHONPATH=/src/src \
            -e RELEASE_TAG -v "$GITHUB_WORKSPACE:/src" unepic-trainer-builder \
            bash -c 'python -m pytest -q -rs && bash packaging/build-appimage.sh && python packaging/smoke.py dist/Unepic-Trainer-*-x86_64.AppImage && QT_QPA_PLATFORM=xcb xvfb-run -a python packaging/smoke.py dist/Unepic-Trainer-*-x86_64.AppImage'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unepic-trainer-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unepic-trainer-x86_64
          path: dist
      - name: Verify checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            if [[ "$(cat release-state)" == false ]]; then
              echo 'Already published; existing assets will not be replaced.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Unepic Trainer $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.AppImage SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
