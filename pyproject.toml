[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unepic-trainer"
version = "0.1.0"
description = "Linux single-player Unepic trainer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pygdbmi>=0.11,<0.12"]

[project.optional-dependencies]
test = ["pytest>=8", "unicorn>=2.1,<3"]

[project.scripts]
unepic-trainer = "unepic_trainer.ui:main"

[project.urls]
Homepage = "https://github.com/0xAF/unepic-trainer"
Issues = "https://github.com/0xAF/unepic-trainer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
